include: package:flutter_lints/flutter.yaml

# Zero Count code standards applied to Dart:
# - fail fast, explicit types, no dynamic leaks in app code
analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures
    - avoid_print
    - require_trailing_commas
