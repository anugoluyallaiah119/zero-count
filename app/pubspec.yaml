name: zerocount_app
description: Zero Count V2 — Flutter app (anti-rummy card game).
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  audioplayers: ^6.1.0
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  stomp_dart_client: ^2.1.0
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/art/
