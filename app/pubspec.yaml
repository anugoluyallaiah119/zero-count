name: zerocount_app
description: Zero Count — Fast-paced anti-rummy card game.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  audioplayers: ^6.1.0
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  stomp_dart_client: ^2.1.0
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  unity_ads_plugin: ^4.1.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/art/logo.png"
  adaptive_icon_background: "#1A0533"
  adaptive_icon_foreground: "assets/art/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1A0533"
  image: assets/art/logo.png
  android_12:
    image: assets/art/logo.png
    icon_background_color: "#1A0533"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/art/
