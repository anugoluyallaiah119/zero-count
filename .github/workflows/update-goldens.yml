# One-shot golden regenerator.
#
# When a PR intentionally changes shared widgets, the committed golden PNGs
# go stale on CI (which runs on Linux, so the pixels can only be canonical
# when generated there). Trigger this workflow from the Actions tab against
# a feature branch and it will:
#   1. Run `flutter test --update-goldens` on ubuntu-latest.
#   2. Commit the diffs and push them back to the same branch.
#   3. The main CI workflow re-runs automatically on the push.
#
# The default GITHUB_TOKEN can push to the same repo when the workflow was
# started manually (not from a fork) — no PAT needed.
name: Regenerate Golden Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to regenerate goldens on'
        required: true
        default: 'feat/v2.2-retention-loop'

permissions:
  contents: write

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Regenerate goldens (Linux, canonical pixels)
        working-directory: app
        run: flutter test --update-goldens

      - name: Commit + push updated goldens
        run: |
          set -e
          git config user.name  'zerocount-ci[bot]'
          git config user.email 'zerocount-ci@users.noreply.github.com'
          if git diff --quiet; then
            echo "no golden changes — CI must have failed for another reason"
            exit 0
          fi
          git add app/test/goldens app/test/failures 2>/dev/null || true
          git add app/test
          git status --short
          git commit -m "chore(goldens): regenerate on Linux to match CI

Auto-generated by .github/workflows/update-goldens.yml against
branch ${{ inputs.branch }}. Reflects the intentional UI changes in
this PR (streak pill, special hint, rematch overlay, choose-your-
zero picker, updated card widgets)."
          git push origin HEAD:${{ inputs.branch }}
