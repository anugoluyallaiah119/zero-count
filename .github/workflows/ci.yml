# Zero Count V2 — CI gate (E4.2). Every PR must pass:
#   1. engine: compile + all E1 suites + 10k-match simulation invariant gate
#   2. backend: mvn verify (Flyway migrations, auth, player, rooms, dormant
#      interface guard) against embedded Postgres
#   3. app: flutter analyze + tests + web build
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Engine suites + 10k-match simulation gate
        run: bash backend/game-engine/run-tests.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven verify (tests run on embedded Postgres — no services needed)
        run: mvn -B -f backend/pom.xml verify

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: analyze
        working-directory: app
        run: flutter analyze
      - name: tests (incl. Dart engine parity + 500-match sim)
        working-directory: app
        run: flutter test
      - name: web build
        working-directory: app
        run: flutter build web --release
