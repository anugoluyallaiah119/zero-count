# Zero Count CI — lean mode (no paid minutes budget).
# Runs ONLY on: push to main, PRs targeting main, manual dispatch.
# Heavy simulation is manual-only (workflow_dispatch).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_heavy:
        description: 'Run 1M-match heavy simulation (expensive)'
        type: boolean
        default: false

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Java engine unit tests (no simulation — fast) ──────────────────────────
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Engine unit suites (E1_1..E1_4 only — skip 10k sim)
        run: mvn -B -f backend/game-engine/pom.xml test -Dexclude="**/*SimulationTest*"

  # ── Backend integration tests (Flyway + auth + rooms) ─────────────────────
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven verify (embedded Postgres — no Docker needed)
        run: mvn -B -f backend/pom.xml verify -Dexclude="**/*SimulationTest*,**/*LoadSmoke*,**/*AdaptiveDraw*"

  # ── Flutter analyze + unit tests only (no goldens, no web build) ───────────
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: analyze
        working-directory: app
        run: flutter analyze
      - name: unit + engine tests (skip golden rendering tests)
        working-directory: app
        run: flutter test --exclude-tags golden

  # ── Heavy simulation — manual dispatch only ────────────────────────────────
  heavy-simulation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_heavy == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 1M-match invariant sweep (shard ${{ matrix.shard }})
        env:
          ZC_SIM_SHARD_SEED: ${{ matrix.shard }}00000
        run: bash backend/game-engine/run-tests.sh --heavy

  # ── Summary ────────────────────────────────────────────────────────────────
  summary:
    needs: [engine, backend, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build summary
        env:
          ENGINE:  ${{ needs.engine.result }}
          BACKEND: ${{ needs.backend.result }}
          APP:     ${{ needs.app.result }}
        run: |
          {
            echo "## Zero Count CI — ${{ github.event_name }} on \`${{ github.head_ref || github.ref_name }}\`"
            echo ""
            echo "| gate | result |"
            echo "|---|---|"
            echo "| engine (unit tests) | ${ENGINE} |"
            echo "| backend (mvn verify) | ${BACKEND} |"
            echo "| app (analyze + unit tests) | ${APP} |"
          } >> "$GITHUB_STEP_SUMMARY"
