<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zero Count — Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; background: #160d2e; color: #eee; margin: 0; padding: 24px; }
  h1 { font-size: 20px; } h2 { font-size: 15px; color: #b678f0; margin-top: 28px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #241546; border-radius: 12px; padding: 14px 20px; min-width: 120px; }
  .card b { display: block; font-size: 26px; color: #ffb830; }
  .card span { font-size: 12px; color: #aaa; }
  table { border-collapse: collapse; width: 100%; max-width: 560px; }
  td, th { text-align: left; padding: 6px 12px; border-bottom: 1px solid #31215a; font-size: 13px; }
  #bar { display: flex; align-items: flex-end; gap: 3px; height: 120px; margin-top: 8px; }
  #bar div { background: #8a3ffb; flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; }
  #auth { margin: 12px 0; } input { width: 340px; padding: 8px; border-radius: 8px; border: 1px solid #31215a; background: #241546; color: #eee; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: #ffb830; font-weight: 700; cursor: pointer; }
  .err { color: #e74c3c; font-size: 13px; }
</style>
</head>
<body>
<h1>Zero Count — Analytics Summary</h1>
<div id="auth">
  <input id="token" type="password" placeholder="Paste an access token (any authenticated user)">
  <button onclick="load_()">Load</button>
  <span id="err" class="err"></span>
</div>
<div class="cards" id="cards"></div>
<h2>Events — last 7 days</h2>
<table id="byname"></table>
<h2>Daily volume — last 14 days</h2>
<div id="bar"></div>
<script>
async function load_() {
  document.getElementById('err').textContent = '';
  const t = document.getElementById('token').value.trim();
  try {
    const r = await fetch('/api/analytics/summary', { headers: { Authorization: 'Bearer ' + t } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    document.getElementById('cards').innerHTML = [
      ['Total events', d.totalEvents], ['Active users · 1d', d.activeUsers1d],
      ['Active users · 7d', d.activeUsers7d]
    ].map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join('');
    document.getElementById('byname').innerHTML =
      '<tr><th>Event</th><th>Count</th></tr>' +
      d.byName7d.map(x => `<tr><td>${x.name}</td><td>${x.count}</td></tr>`).join('');
    const max = Math.max(1, ...d.daily14d.map(x => x.count));
    document.getElementById('bar').innerHTML =
      d.daily14d.map(x => `<div title="${x.day}: ${x.count}" style="height:${100 * x.count / max}%"></div>`).join('');
  } catch (e) { document.getElementById('err').textContent = e.message; }
}
</script>
</body>
</html>
